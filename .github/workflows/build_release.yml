name: Build Android Release

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select artifact to build'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'apk'
          - 'aab'

jobs:
  build:
    name: Build ${{ inputs.build_type }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Configure Keystore from Secrets (If Available)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding keystore from GitHub Secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/ewunavsurvey.jks
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
            echo "storeFile=ewunavsurvey.jks" >> android/key.properties
            echo "Keystore and key.properties configured successfully."
          else
            echo "KEYSTORE_BASE64 secret not found. Checking if android/key.properties exists..."
            if [ -f "android/key.properties" ]; then
              echo "Existing android/key.properties found."
            else
              echo "No keystore configured; build will fall back to debug signing key."
            fi
          fi

      # 1. Build APK
      - name: Build Android Release APK
        if: ${{ inputs.build_type == 'both' || inputs.build_type == 'apk' }}
        run: flutter build apk --release

      # 2. Build AAB (Play Store)
      - name: Build Android Release AppBundle (AAB)
        if: ${{ inputs.build_type == 'both' || inputs.build_type == 'aab' }}
        run: flutter build appbundle --release

      # 3. Upload APK Artifact
      - name: Upload Release APK
        if: ${{ inputs.build_type == 'both' || inputs.build_type == 'apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: ewunavsurvey-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # 4. Upload AAB Artifact
      - name: Upload Release AppBundle (AAB)
        if: ${{ inputs.build_type == 'both' || inputs.build_type == 'aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: ewunavsurvey-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
