name: Build Android APK and AppBundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Configure Keystore from Secrets (If Available)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding keystore from GitHub Secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/ewunavsurvey.jks
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
            echo "storeFile=ewunavsurvey.jks" >> android/key.properties
            echo "Keystore and key.properties configured successfully."
          else
            echo "KEYSTORE_BASE64 secret not found. Checking if android/key.properties exists..."
            if [ ! -f "android/key.properties" ]; then
              echo "Creating fallback key.properties for debug-signing release..."
              touch android/key.properties
            fi
          fi

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Build Android Release AppBundle (AAB for Play Store)
        run: flutter build appbundle --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ewunavsurvey-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Release AppBundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: ewunavsurvey-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
